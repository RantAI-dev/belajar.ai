<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>belajar.ai</title>
    <!-- PNGs are rendered from the SVGs in public/ (icon.svg, icon-maskable.svg). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Sets <html data-theme> before the first paint (no flash of the other theme). Same key and
         rules as src/ui/themePreference.ts; src/app/noFlash.test.ts runs this script. -->
    <script id="theme-boot">
      (() => {
        let preference = "system";
        let stored = null;
        try {
          stored = window.localStorage.getItem("belajar.theme");
        } catch {}
        if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        let dark = preference === "dark";
        if (preference === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {}
        }
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
